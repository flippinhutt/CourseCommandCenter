name: Attest release artifacts

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}" --pattern "main.js" --pattern "styles.css" --dir ./release-assets

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: release-assets/*
